version: 2

sources:
  - name: classic_models
    description: "ClassicModels dataset — a scale model car retailer used as the capstone source."
    schema: classicmodels
    tables:
      - name: customers
        description: "All customer records including contact info, address, and credit limit."
        columns:
          - name: customernumber
            description: "Unique identifier for each customer."
            tests:
              - unique
              - not_null
          - name: customername
            description: "Full business name of the customer."
            tests:
              - not_null
          - name: salesrepemployeenumber
            description: "FK to employees — the assigned sales representative."

      - name: orders
        description: "Order header records placed by customers."
        columns:
          - name: ordernumber
            description: "Unique identifier for each order."
            tests:
              - unique
              - not_null
          - name: customernumber
            description: "FK to customers."
            tests:
              - not_null
          - name: status
            description: "Current order status (Shipped, Resolved, Cancelled, On Hold, Disputed, In Process)."

      - name: orderdetails
        description: "Line-item detail for each order."
        columns:
          - name: ordernumber
            description: "FK to orders."
            tests:
              - not_null
          - name: productcode
            description: "FK to products."
            tests:
              - not_null
          - name: quantityordered
            description: "Number of units ordered for this line."
          - name: priceeach
            description: "Negotiated unit price at time of order."

      - name: products
        description: "Product catalog with pricing and inventory."
        columns:
          - name: productcode
            description: "Unique identifier for each product."
            tests:
              - unique
              - not_null
          - name: productline
            description: "FK to productlines — the product category."
            tests:
              - not_null

      - name: productlines
        description: "Top-level product categories."
        columns:
          - name: productline
            description: "Unique name / PK of the product line."
            tests:
              - unique
              - not_null

      - name: employees
        description: "Employee roster including reporting hierarchy."
        columns:
          - name: employeenumber
            description: "Unique identifier for each employee."
            tests:
              - unique
              - not_null
          - name: officecode
            description: "FK to offices."
            tests:
              - not_null

      - name: offices
        description: "Physical office locations."
        columns:
          - name: officecode
            description: "Unique identifier for each office."
            tests:
              - unique
              - not_null

      - name: payments
        description: "Customer payment transactions."
        columns:
          - name: customernumber
            description: "FK to customers."
            tests:
              - not_null
          - name: checknumber
            description: "Check or payment reference number (unique per customer)."
          - name: amount
            description: "Payment amount."
            tests:
              - not_null
